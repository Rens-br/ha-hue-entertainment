set_colors:
  target:
    entity:
      integration: ha_hue_entertainment
      domain: light
  fields:
    channels:
      example: '{"0": [255, 0, 0], "3": "#00ff00"}'
      selector:
        object:
    all:
      example: "[255, 120, 0]"
      selector:
        color_rgb:
    brightness_pct:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    overlay:
      default: false
      selector:
        boolean:
    duration:
      example: 5
      selector:
        number:
          min: 0.1
          max: 3600
          step: 0.1
          unit_of_measurement: s
    clear_overlay:
      default: false
      selector:
        boolean:

play_scene:
  target:
    entity:
      integration: ha_hue_entertainment
      domain: light
  fields:
    scene:
      required: true
      example: sweep
      selector:
        text:
    params:
      example: '{"color": "#0050ff", "bounce": true}'
      selector:
        object:
    speed:
      selector:
        number:
          min: 0.1
          max: 4
          step: 0.1
    transition:
      selector:
        number:
          min: 0.1
          max: 300
          step: 0.1
          unit_of_measurement: s

stop_scene:
  target:
    entity:
      integration: ha_hue_entertainment
      domain: light
